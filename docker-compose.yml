# Levanta SQL Server y la API. Los secretos salen de .env (copia .env.example).
#   docker compose up --build
name: backend-asa

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__database-asa: "Server=db,1433;Database=BibliotecaAsa;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY en .env (32 caracteres o más)}
      Cors__AllowedOrigins__0: http://localhost:5173
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD en .env}
      Seed__LectorPassword: ${SEED_LECTOR_PASSWORD:?Define SEED_LECTOR_PASSWORD en .env}
      Database__MigrateOnStartup: "true"

volumes:
  mssql-data:
