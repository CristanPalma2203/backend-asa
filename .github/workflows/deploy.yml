name: Build y push de la imagen a GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Una publicación a la vez; si llega otro push mientras una está en curso, la nueva espera.
concurrency:
  group: publish-backend-asa-image
  cancel-in-progress: false

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

env:
  IMAGE: ghcr.io/cristanpalma2203/backend-asa

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tests de integración: Testcontainers levanta SQL Server con el Docker del runner.
      - name: dotnet test
        run: dotnet test tests/backend-asa.Tests/backend-asa.Tests.csproj -c Release

  image:
    name: Imagen a GHCR
    needs: test
    # Solo se publica lo que está en main (también al lanzarlo a mano).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Liga el paquete de GHCR a este repositorio.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
